<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reseñas - Huerta Automatizada</title>
    <link rel="stylesheet" href="/frontend/ESTILOS/resenas.css">


</head>

<body>
    <div class="navbar">
        <h1>🌿 Huerta Automatizada</h1>
        <span>Reseñas</span>
    </div>

    <div class="container">
        <h2>💬 Deja tu reseña</h2>
        <form id="formulario" onsubmit="enviarResena(event)">
            <input type="text" id="username" placeholder="Tu nombre" required />
            <textarea id="content" placeholder="Escribe tu reseña..." required></textarea>


            <button type="submit">Publicar reseña</button>
        </form>


        <section>

            <h2>📖 Reseñas de otros usuarios</h2>
            <div class="reviews " id="resenas"> </div>
        </section>


        <div id="message"> </div>
    </div>

    <script src="/frontend/JAVASCRIPT/enviar_resenas.js"></script>

    <script>
        function cargarResenas() {
            fetch("http://localhost/huerta-automatizada/backend/reviews.php")
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById("resenas");
                    container.innerHTML = "";
                    if (!Array.isArray(data) || data.length === 0) {
                        container.innerHTML = "<p>No hay reseñas disponibles.</p>";
                        return;
                    }
                    data.forEach(resena => {
                        const div = document.createElement("div");
                        div.className = "review-card";
                        div.innerHTML = `
                    <p >"${resena.content}"</p>
                    <p >- ${resena.name}</p>
                    <p>${new Date(resena.created_at).toLocaleDateString('es-ES')}</p>
                `;
                        container.appendChild(div);
                    });
                })
                .catch(err => {
                    document.getElementById("resenas").innerHTML = "<p>Error al cargar reseñas.</p>";
                });
        }
        window.onload = cargarResenas;
    </script>


</body>

</html>
