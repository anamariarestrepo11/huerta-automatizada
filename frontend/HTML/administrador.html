<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de administración para gestión de reseñas">
    <meta name="author" content="Ecoenergy">
    <title>Panel de Administración - Reseñas Ecoenergy</title>
    <link rel="stylesheet" href="/frontend/ESTILOS/administrador.css">
</head>

<body>
    <!-- =============================================
    HEADER/NAVBAR DEL PANEL DE ADMINISTRACIÓN
    ============================================= -->
    <header class="admin-header">
        <div class="header-container">
            <div class="admin-logo">
                <div class="logo">ECO</div>
                <div class="admin-title">
                    <h1>Panel de Administración</h1>
                    <p>Gestión de reseñas de usuarios</p>
                </div>
            </div>
            <div class="admin-actions">
                <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
            </div>
        </div>
    </header>

    <!-- =============================================
        CONTENEDOR PRINCIPAL DEL PANEL
    ============================================= -->
    <div class="admin-container">
        <!-- Header del panel con estadísticas -->
        <div class="panel-header">
            <h2>Reseñas de Usuarios</h2>
            <p>Gestiona todas las reseñas recibidas y controla su visibilidad en el sitio web</p>
            <div class="panel-stats">
                <div class="stat-card">
                    <div class="stat-number" id="total_resenas">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="visibles_resenas">0</div>
                    <div class="stat-label">Visibles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="invisibles_resenas">0</div>
                    <div class="stat-label">Ocultas</div>
                </div>
            </div>
        </div>

        <!-- Tabla principal de reseñas -->
        <div class="table-container">
            <table class="requests-table">
                <thead>
                    <tr>
                        <th class="col-id">ID</th>
                        <th class="col-name">Nombre</th>
                        <th class="col-review">Reseña</th>
                        <th class="col-date">Fecha</th>
                        <th class="col-visibility">Visible</th>
                        <th class="col-actions">Acciones</th>
                    </tr>
                </thead>
                <tbody id="resenas_tabla">
                    <!-- Reseñas cargadas dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- =============================================
        JAVASCRIPT INCRUSTADO
    ============================================= -->
    <script>
        // Simulación de datos de reseñas
        const reseñas = [
            { id: 1, nombre: "Ana", mensaje: "Muy buena experiencia", fecha: "2025-10-12", visible: true },
            { id: 2, nombre: "Luis", mensaje: "Mejorable en tiempos de respuesta", fecha: "2025-10-13", visible: false },
            { id: 3, nombre: "María", mensaje: "Excelente atención", fecha: "2025-10-14", visible: true }
        ];

        // Mostrar estadísticas
        function actualizarEstadisticas() {
            const total = reseñas.length;
            const visibles = reseñas.filter(r => r.visible).length;
            const ocultas = total - visibles;

            document.getElementById("total_resenas").textContent = total;
            document.getElementById("visibles_resenas").textContent = visibles;
            document.getElementById("invisibles_resenas").textContent = ocultas;
        }

        // Cargar reseñas en tabla
        function cargarReseñas() {
            const tbody = document.getElementById("resenas_tabla");
            tbody.innerHTML = "";

            reseñas.forEach(resena => {
                const fila = document.createElement("tr");
                fila.innerHTML = `
                    <td>${resena.id}</td>
                    <td>${resena.nombre}</td>
                    <td>${resena.mensaje}</td>
                    <td>${resena.fecha}</td>
                    <td>${resena.visible ? "Sí" : "No"}</td>
                    <td>
                        <button onclick="toggleVisibilidad(${resena.id})">
                            ${resena.visible ? "Ocultar" : "Mostrar"}
                        </button>
                        <button onclick="eliminarResena(${resena.id})">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(fila);
            });
        }

        // Alternar visibilidad
        function toggleVisibilidad(id) {
            const index = reseñas.findIndex(r => r.id === id);
            if (index !== -1) {
                reseñas[index].visible = !reseñas[index].visible;
                cargarReseñas();
                actualizarEstadisticas();
            }
        }

        // Eliminar reseña
        function eliminarResena(id) {
            const confirmacion = confirm("¿Estás seguro de que deseas eliminar esta reseña?");
            if (confirmacion) {
                const index = reseñas.findIndex(r => r.id === id);
                if (index !== -1) {
                    reseñas.splice(index, 1);
                    cargarReseñas();
                    actualizarEstadisticas();
                }
            }
        }

        // Simular cierre de sesión
        function cerrarSesion() {
            alert("Sesión cerrada");
            window.location.href = "login.html";
        }

        // Inicializar panel
        document.addEventListener("DOMContentLoaded", () => {
            cargarReseñas();
            actualizarEstadisticas();
        });
    </script>

</body>

</html>
